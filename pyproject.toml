[project]
name = "sighthound-video"
version = "7.0.16"
description = "Sighthound Video desktop VMS, ported to Python 3.11+"
readme = "README.md"
# 3.11+ stays supported. The Windows build prefers 3.14 and refuses 3.15:
# onnxruntime-directml 1.24.4 has no win_amd64 cp315 wheel.
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["COPYING"]
dependencies = [
    "Pillow>=10",
    "requests>=2.31",
    "wxPython>=4.2",
    "numpy>=1.26",
    "av>=12",
    "onnxruntime>=1.18",
]

[project.optional-dependencies]
package = ["pyinstaller>=6"]
# onnx builds the tiny test detector. opencv-python-headless is the USB camera
# option (DirectShow on Windows). onnxruntime-directml replaces onnxruntime on
# Windows when DirectML is wanted; do not install both.
vision = ["opencv-python-headless>=4.8"]
dev = ["pytest>=8", "ruff>=0.6", "onnx>=1.16"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["appCommon*", "backEnd*", "frontEnd*", "launch*", "vitaToolbox*", "xnat*"]
namespaces = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
# The tree is still legacy style. This selection catches syntax that will
# not import (undefined names, invalid syntax) without rewriting every file.
select = ["E9", "F821", "F822", "F823"]
