[project]
name = "sighthound-video"
version = "7.0.16"
description = "Sighthound Video desktop VMS, ported to Python 3.11+"
readme = "README.md"
# 3.11+ stays supported. The Windows build prefers 3.14 and refuses 3.15:
# onnxruntime-directml 1.24.4 has no win_amd64 cp315 wheel.
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["COPYING"]
dependencies = [
    "Pillow>=10",
    "requests>=2.31",
    "wxPython>=4.2",
]

[project.optional-dependencies]
package = ["pyinstaller>=6"]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["appCommon*", "backEnd*", "frontEnd*", "launch*", "vitaToolbox*", "xnat*"]
namespaces = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Default norecursedirs is replaced, not extended. Keep hidden directories out,
# and also skip a virtualenv named venv (no leading dot).
norecursedirs = [
    ".git",
    ".venv",
    "venv",
    "build",
    "dist",
    ".*",
    "*.egg",
    "*.egg-info",
    "__pycache__",
]

[tool.ruff]
target-version = "py311"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
# The tree is still legacy style. This selection catches syntax that will
# not import (undefined names, invalid syntax) without rewriting every file.
select = ["E9", "F821", "F822", "F823"]
