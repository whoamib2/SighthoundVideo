name: CI

on:
  push:
  pull_request:

jobs:
  python:
    name: python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test tools
        run: python -m pip install --upgrade pip pytest ruff pillow requests
      - name: Compile
        run: python -m compileall -f -q appCommon backEnd frontEnd launch scripts vitaToolbox xnat FrontEndLaunchpad.py PackageSources.py
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest

  native:
    name: cmake / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libminiupnpc-dev libnatpmp-dev
      - name: Build native libraries
        shell: bash
        run: |
          set -euo pipefail
          cmake -S backEnd/triggers -B build/optsearches
          cmake --build build/optsearches --config Release
          cmake -S launch -B build/launch
          cmake --build build/launch --config Release
          cmake -S xnat -B build/xnat
          cmake --build build/xnat --config Release
